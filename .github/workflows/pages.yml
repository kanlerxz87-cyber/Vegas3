name: Validate site build and links
# Pages is published by the repository's legacy Pages build (branch main, path /), which serves the
# root index.html, pages/ and assets/. deploy-pages needs the "GitHub Actions" build type and failed
# under the legacy setting, so this workflow validates instead of deploying:
# it rebuilds pages/ from data/site.json, runs the verifier, and fails if the committed pages/ is stale.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required site files
        run: test -s index.html && test -s styles.css && test -s app.js && test -s pages/index.html
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild pages from data
        run: python3 scripts/build_site.py
      - name: Verify sources, internal links and external links
        run: python3 scripts/verify_site.py
      - name: Fail if committed pages/ or assets/ are out of date
        run: git diff --exit-code -- pages assets
