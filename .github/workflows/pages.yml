name: Validate site build and links
# Pages is published by the repository's legacy Pages build (branch main, path /).
# deploy-pages needs the "GitHub Actions" build type, so this workflow only validates:
# it rebuilds docs/ from data/, runs the source and link verifier, and fails if the committed docs/ is stale.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required site files
        run: test -s index.html && test -s styles.css && test -s app.js && test -s docs/index.html
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild docs from data
        run: python3 scripts/build_site.py
      - name: Verify sources, internal links and external links
        run: python3 scripts/verify_site.py
      - name: Fail if committed docs/ is out of date
        run: git diff --exit-code -- docs
